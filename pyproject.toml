[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chrysalis"
version = "0.1.0"
description = "AI Agent skill self-evolution engine — let your agent learn from experience"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
chrysalis = "chrysalis.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chrysalis"]
